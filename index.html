<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Resources</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.5.1/github-markdown.min.css" />
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2328;
    --muted: #656d76;
    --border: #d1d9e0;
    --accent: #0969da;
    --card-bg: #f6f8fa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #8b949e;
      --border: #30363d;
      --accent: #4493f8;
      --card-bg: #161b22;
    }
    .markdown-body { color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  header {
    padding: 28px 20px 20px;
    max-width: 780px;
    margin: 0 auto;
  }
  header h1 {
    font-size: 22px;
    margin: 0 0 6px;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }
  main {
    max-width: 780px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }
  #list { display: flex; flex-direction: column; gap: 12px; }
  .card {
    display: block;
    border: 1px solid var(--border);
    background: var(--card-bg);
    border-radius: 10px;
    padding: 16px 18px;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
  }
  .card h2 {
    margin: 0 0 6px;
    font-size: 16px;
    color: var(--accent);
  }
  .card p {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
  }
  #reader { display: none; }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .toolbar a, .toolbar button {
    font-size: 13px;
    text-decoration: none;
    color: var(--accent);
    border: 1px solid var(--border);
    background: var(--card-bg);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
  }
  .markdown-body {
    background: transparent !important;
    color: var(--fg) !important;
  }
  .markdown-body pre { background: var(--card-bg) !important; }
  #app[hidden] { display: none; }
</style>
</head>
<body>

<header>
  <h1>Resources</h1>
  <p>Downloadable, readable. Click one to read it here, or grab the raw .md file.</p>
</header>

<main>
  <div id="list"></div>

  <div id="reader">
    <div class="toolbar">
      <button onclick="showList()">&larr; Back to list</button>
      <a id="downloadLink" download>Download .md</a>
    </div>
    <article class="markdown-body" id="content"></article>
  </div>
</main>

<script>
let manifest = [];

async function init() {
  const res = await fetch('manifest.json');
  manifest = await res.json();
  renderList();

  const params = new URLSearchParams(location.search);
  const doc = params.get('doc');
  if (doc) openDoc(doc, false);
}

function renderList() {
  const list = document.getElementById('list');
  list.innerHTML = manifest.map(d => `
    <a class="card" href="?doc=${d.slug}" onclick="event.preventDefault(); openDoc('${d.slug}', true);">
      <h2>${d.title}</h2>
      <p>${d.description}</p>
    </a>
  `).join('');
}

async function openDoc(slug, pushState) {
  const doc = manifest.find(d => d.slug === slug);
  if (!doc) return;

  const res = await fetch(doc.file);
  const md = await res.text();

  document.getElementById('content').innerHTML = marked.parse(md);
  document.getElementById('downloadLink').href = doc.file;
  document.getElementById('downloadLink').download = doc.file.split('/').pop();

  document.getElementById('list').parentElement.querySelector('#list').style.display = 'none';
  document.getElementById('reader').style.display = 'block';
  window.scrollTo(0, 0);

  if (pushState) history.pushState({}, '', '?doc=' + slug);
}

function showList() {
  document.getElementById('reader').style.display = 'none';
  document.getElementById('list').style.display = 'flex';
  history.pushState({}, '', location.pathname);
}

window.addEventListener('popstate', () => {
  const params = new URLSearchParams(location.search);
  const doc = params.get('doc');
  if (doc) openDoc(doc, false);
  else showList();
});

init();
</script>

</body>
</html>
